[workspace]
resolver = "2"
members = [
    "crates/orbit-core",
    "crates/orbit-converters",
    "crates/orbit-ui",
    "crates/orbit-windows",
    "crates/orbit-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Michael De Leon <michaeldeleonrwds-debug@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
orbit-core = { path = "crates/orbit-core" }
orbit-converters = { path = "crates/orbit-converters" }
orbit-ui = { path = "crates/orbit-ui" }
orbit-windows = { path = "crates/orbit-windows" }

# Logging and Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Serialization and Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async & Concurrency
tokio = { version = "1.43", features = ["full"] }
crossbeam-channel = "0.5"

# Imaging & Graphics
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico", "gif", "bmp", "tiff", "tga", "dds", "pnm"] }
resvg = "0.48"
usvg = "0.48"
tiny-skia = "0.12"

# UI
slint = "1.18"
slint-build = "1.18"

# Windows API
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "System",
] }
directories = "6.0"
thiserror = "2.0"
anyhow = "1.0"
